name: iacula_app
description: "Iacula Flutter mobile app"
publish_to: 'none'
version: 1.2.3+53

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  cronet_http: ^1.8.0
  sqflite: ^2.4.2
  path: ^1.9.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_local_notifications: ^19.4.2
  flutter_timezone: ^4.0.1
  timezone: ^0.10.1
  vibration: ^3.1.3
  google_fonts: ^6.3.0
  url_launcher: ^6.3.2
  supabase_flutter: ^2.9.1
  flutter_secure_storage: ^9.2.4
  in_app_purchase: ^3.2.0
  connectivity_plus: ^6.1.5
  workmanager: ^0.9.0+3
  shimmer: ^3.0.0
  uuid: ^4.5.1
  html: ^0.15.6
  path_provider: ^2.1.5
  flutter_svg: ^2.1.0
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.13
  webview_flutter_wkwebview: ^3.23.8
  share_plus: ^11.1.0
  home_widget: ^0.7.0
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/auth/
    - assets/seed/quotes/pt-br/
    - assets/seed/prayers/en/
    - assets/seed/prayers/la/
    - assets/seed/prayers/pt-br/
    - assets/seed/prayers/details/
    - assets/seed/images/
    - assets/seed/images/advent/
    - assets/seed/images/angelus/
    - assets/seed/images/christmas/
    - assets/seed/images/easter/
    - assets/seed/images/feasts/all-saints/
    - assets/seed/images/feasts/assumption/
    - assets/seed/images/feasts/corpus-christi/
    - assets/seed/images/feasts/easter-sunday/
    - assets/seed/images/feasts/easter-vigil/
    - assets/seed/images/feasts/good-friday/
    - assets/seed/images/feasts/holy-thursday/
    - assets/seed/images/feasts/holy-trinity/
    - assets/seed/images/feasts/immaculate-conception/
    - assets/seed/images/feasts/our-lady-aparecida/
    - assets/seed/images/feasts/palm-sunday/
    - assets/seed/images/feasts/pentecost/
    - assets/seed/images/feasts/st-joseph/
    - assets/seed/images/feasts/sts-peter-paul/
    - assets/seed/images/lent/
    - assets/seed/images/ordinary/1/
    - assets/seed/images/ordinary/2/
    - assets/seed/images/ordinary/3/
    - assets/seed/images/ordinary/4/
    - assets/seed/images/ordinary/5/
    - assets/seed/images/ordinary/6/
    - assets/seed/images/ordinary/7/
    - assets/seed/images/reginaCaeli/
    - assets/seed/audio/
    - assets/seed/examination/
    - assets/seed/journal_prompts/
    - assets/seed/night_prayer/
    - assets/seed/liturgy_hours/
    - assets/seed/bible/
    - assets/seed/bible/antigotestamento/
    - assets/seed/bible/novotestamento/
    - assets/books/escriva/
    - assets/books/library/
    - assets/books/library/authors/
    - assets/books/library/works/
    - assets/fonts/google_fonts/
    - assets/placeholders/sections/
    - assets/placeholders/sections/intencoes/
    - assets/placeholders/sections/minhas-frases/
    - assets/placeholders/
    - assets/icons/sections/


dependency_overrides:
  isar_flutter_libs:
    path: third_party/isar_flutter_libs

flutter_launcher_icons:
  android: true
  ios: true
  image_path_ios: "assets/images/icon.png"
  image_path_android: "assets/images/icon_android.png"
  remove_alpha_ios: true
